# THE QUICK LANE. Every push, every pull request, and a button.
#
# WHAT CHANGED ON 2026-09-03 AND WHY. This workflow used to be the whole matrix - six runtime
# identifiers, four fuzz sessions of 25,000 iterations on each of them, and the Android emulator -
# and it ran on every push with no concurrency group. Three pushes in a row therefore left three
# complete matrices running at once, and the last of them took 26m56s. Neither half of that was
# buying anything: the earlier runs were scoring commits nobody would look at again, and the
# matrix was answering one deterministic question six times.
#
# TWO CHANGES, and the first is the one that matters most for the complaint that produced it.
#
# 1. THE CONCURRENCY GROUP BELOW. A new push on a branch cancels the run the previous push
#    started. Nothing about what is checked changes; what changes is that three pushes cost one
#    matrix instead of three. The review lane has had this since it was written and this one
#    simply did not.
#
# 2. THE SPLIT. This lane takes two of the six cells - one per architecture, both Linux, which are
#    the two cheapest on the workload that remains after the long fuzz sessions come out - and
#    runs the fuzz sessions at 2,000 iterations rather than 25,000. broiler-vm-full.yml runs all
#    six at 25,000 with the emulator, on a release tag, on a weekly schedule and on a button.
#
# The measurement that decided it, from run 33738744632: the six publish jobs took 759, 882, 917,
# 1041, 1051 and 1405 seconds, and the fuzz-and-mutate step was 88 to 91 per cent of every one of
# them. Everything else in a publish job - six Native AOT publishes of four composition roots,
# running each, and the package consumer - is 78 to 208 seconds. The wall clock was one step.
#
# WHAT THIS LANE THEREFORE DOES NOT PROVE. It is blind to a Windows-only and a macOS-only
# regression until the full lane runs, and this component has already had one: the soak's heap
# plateau failed on macOS under Native AOT, on both architectures, byte-identically across three
# runs, while every other RID stayed flat. It also reaches less far into the mutation space per
# session. **A green quick lane is a fast signal and not the gate**, and a release goes through
# broiler-vm-full.yml.
#
# WHAT IS ABRIDGED HERE, IN FULL. Two things, and both are a DEPTH the caller names rather than a
# check it turns off: the fuzz sessions run at 2,000 iterations rather than 25,000, and the Octane
# workload runs six of its fifteen benchmarks rather than all of them. The Octane entry was added
# on 2026-09-05 after the workload step's first run measured what it costs - 23m28s for fifteen
# benchmarks on `ubuntu-latest`, on a job whose every other step totals 78 to 208 seconds - and
# the six are named below by what they reach.
#
# Everything else this lane runs is unabridged: the whole suite, the graph and drift rules, the
# pack and feed-consumer checks, every composition root published as Native AOT and run, the
# conformance suite scored in shards against its floor, the corpus-integrity mutation, the mobile
# head compiled, and both third-party workloads run out of the published image on both cells. No
# check is disabled anywhere - the lane definition takes a matrix, an iteration count, a benchmark
# selection and one emulator switch whose false branch still BUILDS the head, so there is no input
# by which one caller can skip a check the other runs.

name: broiler-vm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A later push on the same branch cancels the earlier run. Deliberately keyed on the branch rather
# than on the workflow alone, so two branches never cancel each other.
concurrency:
  group: broiler-vm-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick
    uses: ./.github/workflows/broiler-vm-lane.yml
    with:
      # One cell per architecture. Both Linux, so the only variable between them is the
      # architecture and a red job names it; and measured cheapest on this workload - 78 seconds
      # for linux-arm64 against 108 for osx-arm64, once the long fuzz sessions are out.
      matrix: >-
        {"include":[
          {"os":"ubuntu-latest","rid":"linux-x64"},
          {"os":"ubuntu-24.04-arm","rid":"linux-arm64"}
        ]}
      # Four sessions, short. A session is a total function of its seed and its seed corpus, so a
      # short one is a prefix of a long one and finds a subset of what the full lane finds - never
      # something different. It still fails if it never reaches the executor, so a lane that had
      # shortened its way into exercising nothing would be red rather than quick.
      fuzz-iterations: 2000
      # The emulator is the full lane's. The head is still COMPILED here, because a head that
      # stops building is a defect a pull request introduced.
      android: false
      # SIX OF OCTANE'S FIFTEEN, AND THE FULL SET IS THE FULL LANE'S. All fifteen out of the
      # published image took 23m28s on `ubuntu-latest`, on a job whose every other step totals 78
      # to 208 seconds; twice that per push is the cost this split exists to refuse. The six are
      # chosen by what they REACH rather than by what they cost, because what changes with a
      # runtime identifier is whether the published image can execute a corpus at all: `richards`
      # is property and method dispatch, `crypto` integer arithmetic over arrays, `raytrace`
      # allocation through prototypes and closures, `regexp` the matcher JSW-4 wrote from scratch,
      # `splay` a live heap and the latency path, and `code-load` the FRONT END on a large source
      # rather than the executor. A benchmark this selection drops is one the full lane still runs
      # on all six cells.
      octane-benchmarks: richards crypto raytrace regexp splay code-load
