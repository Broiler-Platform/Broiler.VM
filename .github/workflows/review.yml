# The review lane.
#
# Produces and updates the human-review record on every pull request. A reviewer
# writes one thing - the `// Broiler-Human:` line on the declaration they read -
# and this lane runs the generator, which fills the machine fields, refreshes a
# decision the code has outrun into `STALE; Previous=...` and rewrites
# HUMAN_REVIEW.md, CODE-ASSURANCE.md, assurance.manifest.json and every generated
# source header from the tree. Whatever moved is committed back onto the branch.
#
# It then runs the gate with nothing set, which asserts that what is now on disk
# is byte-identical to what the generator would write. A generation that is not a
# fixed point fails here rather than on the next pull request.
#
# WHICH TESTS, SINCE 2026-10-19. Both runs are the architecture suite's assurance
# tests and nothing else: the classes whose names begin `Assurance`, which hold
# the assurance generator's writers and rules J1 to J11, and two more that read
# the artefacts those writers produce - `RegisterFigureTests` (rule J12) and
# `ReviewRecordRuleTests` (rules H1 to H5). Until then each run was the whole
# solution, twice, and every test this lane no longer runs is in `dotnet test`
# of the lane's required `checks` job on the same image. The filter is held to
# finding something: a rename that left it matching nothing would otherwise turn
# this required check into a green run of no tests. Neither run builds; the step
# before them does.
#
# What this lane does NOT do, so that nobody reads more into it: it does not
# decide anything. The generator may fill a fingerprint and may never turn
# PENDING into a name - AssuranceGenerator.RefuseInventedApproval throws rather
# than exceed that budget, and rule J4 asserts the same property over the
# rendered artefacts.

name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Produce the review record
    runs-on: ubuntu-latest

    env:
      ASSURANCE_TESTS: src/tests/Broiler.VM.Architecture.Tests/Broiler.VM.Architecture.Tests.csproj
      ASSURANCE_FILTER: >-
        FullyQualifiedName~Broiler.VM.Architecture.Tests.Assurance|FullyQualifiedName~Broiler.VM.Architecture.Tests.RegisterFigureTests|FullyQualifiedName~Broiler.VM.Architecture.Tests.ReviewRecordRuleTests

    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          # The head branch itself, not the merge commit, because this job
          # commits back to it.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Broiler.VM.slnx -c Release

      - name: Regenerate every assurance artefact
        env:
          BROILER_ASSURANCE_WRITE: '1'
        run: >-
          dotnet test "$ASSURANCE_TESTS" -c Release --no-build
          --filter "$ASSURANCE_FILTER"
          -- RunConfiguration.TreatNoTestsAsError=true

      # A step that restored docs/evidence/vm-0/d1-outcome.txt stood here until
      # 2026-10-19. Rule D1 used to write that file on every run; it writes it only
      # when BROILER_EVIDENCE_WRITE=1 now, which nothing here sets, and the filter
      # above does not run rule D1 at all, so the restore had nothing to undo.

      - name: Report what the generator changed
        id: generated
        run: |
          git add -A -- HUMAN_REVIEW.md CODE-ASSURANCE.md assurance.manifest.json 'src/**/*.cs'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every assurance artefact was already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit the record back to the branch
        if: >-
          steps.generated.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate the assurance record' \
                     -m 'Produced by the review lane from the annotations in the tree.'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Fail when a fork's record is out of date
        # A pull request from a fork gives this job no write access to the fork's
        # branch, so the record cannot be committed there. Saying so and failing
        # is the honest outcome: the alternative is a green lane over a record
        # that does not describe the tree.
        if: >-
          steps.generated.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::The assurance artefacts are not current, and this lane cannot' \
               'commit to a fork. Run BROILER_ASSURANCE_WRITE=1 dotnet test Broiler.VM.slnx' \
               '-c Release locally and push the result.'
          git diff --cached
          exit 1

      - name: Publish the record as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: human-review-record
          path: |
            HUMAN_REVIEW.md
            CODE-ASSURANCE.md

      - name: Gate - what is on disk is what the generator would write
        run: >-
          dotnet test "$ASSURANCE_TESTS" -c Release --no-build
          --filter "$ASSURANCE_FILTER"
          -- RunConfiguration.TreatNoTestsAsError=true
