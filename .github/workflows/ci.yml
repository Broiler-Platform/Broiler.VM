# CI: the Windows build, test, pack and feed check, and the validation a publish runs.
#
# ONE OPERATING SYSTEM ON A PULL REQUEST AND A PUSH, BOTH UNDER A PUBLISH OR A BUTTON, SINCE
# 2026-10-19. Until then a pull request and a push ran an ubuntu leg beside the Windows one, and
# that leg repeated what the lane's `checks` job runs on the same image at the same ref: the same
# build, there with warnings as errors, and the same `dotnet test` of the solution. In 226 runs it
# failed seven times and the Windows leg and `checks` failed with it every time, so it never caught
# anything alone. The Windows leg is the only per-pull-request run of the suite under Windows paths,
# culture, NLS and time zones, and the only one of pack.ps1 and verify-feed.ps1, so it is the one
# that stays. A publish calls this workflow with the version it resolved, and a dispatch is somebody
# asking for the whole answer, so both still run both legs: a release is built and tested on both
# operating systems before it is pushed. The job keeps its name, so the check a pull request shows
# is still `windows-latest / Release`.
#
# A PUSH TO MAIN WHOSE TREE ITS PULL REQUEST ALREADY TESTED RUNS ONLY THE GATE, SINCE 2026-10-19,
# by the rule broiler-vm.yml's header states and eng/gate-tested-merge.py holds. HERE THE TEST OF
# THE EVENT IS NOT DECORATION. A workflow entered through workflow_call sees its caller's event, so
# a publish started by a tag push arrives as a push; the gate runs only on a push to main, and the
# script checks the event and the ref again, so a publish is never skipped and always validates.
# For the same rule a pull request starts this workflow only when it is into main, since the same
# date, as broiler-vm.yml's header explains: the gate relies on this workflow's check on the merged
# head, and only for a pull request into main does its ancestry test show that the run tested that
# head's own tree.

name: CI

on:
  push:
    branches: [main]
  # Into main only: the header says why.
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (CI)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The check runs on the pull request's head are what the decision reads. A caller must grant
      # this too, which is why publish.yml's `validate` job does, though the gate never runs there.
      checks: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: eng/gate-tested-merge.py
          sparse-checkout-cone-mode: false

      - name: Decide whether a pull request's runs already tested this tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/gate-tested-merge.py

  build:
    name: ${{ matrix.os }} / Release
    needs: gate
    # Skipped on a pull request, a button and a publish, the gate decides nothing there, and a gate
    # that fails decides nothing either: the build runs unless the gate said this tree was tested.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # `inputs.package-version` is null on a pull request, a push and a dispatch, and null
        # compares equal to '' in an expression, so only a caller that passes a version - the
        # publish lane - and a dispatch take both legs.
        os: ${{ fromJSON((inputs.package-version != '' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04","windows-latest"]' || '["windows-latest"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Restore projects without version locks
        run: dotnet restore Broiler.VM.slnx --nologo

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.VM.slnx -c Release --nologo "${args[@]}"

      - name: Test
        run: bash ./eng/run-tests.sh Release

      - name: Pack and verify every package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Verify consumer restore from nuget.org (dry run)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/verify-feed.ps1

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
