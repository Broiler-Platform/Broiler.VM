# The component's own CI, deferred to VM-6 by ADR 0001 and recorded as exclusion EX-06 until now.
#
# What this workflow is FOR: the checks that a laptop cannot honestly run. The suites, the graph
# rules, the catalog and API drift baselines and the assurance generator all run in `dotnet test`
# and a contributor runs them before pushing; what a contributor cannot do is prove the component
# builds on a machine that is not theirs, restores from a feed rather than from their own project
# graph, or publishes a Native AOT image on a runtime identifier they do not own.
#
# WHAT IT DOES NOT DO. It does not collect an evidence bundle. Bundles are collected deliberately,
# by a person, into `docs/evidence/`, and a workflow that regenerated them on every push would
# make the retained figures a function of whichever runner happened to answer - which for the
# baselines in `docs/baselines.md` would be actively false. The gate asks for drift checks in CI
# and for evidence in bundles, and those are different things.
#
# HONESTY NOTE, and it belongs at the top rather than in a footnote. When this file was written it
# had NEVER RUN, and it said so here. It has run since - on ubuntu-latest and windows-latest,
# publishing and running every composition root as Native AOT on linux-x64 and win-x64 - so the RID
# matrix below is not aspirational for either of those. It ran on macos-latest and osx-arm64 too,
# until 2026-09-01: that RID is one ADR 0012 marks RESERVED, no head in the consuming repository
# targets macOS, and a lane publishing a RID the declared matrix does not hold is drift towards a
# claim the ADR forbids rather than extra assurance. The SAME DAY the matrix gained linux-arm64 by
# a decision of its own, and that entry has now run too: ubuntu-24.04-arm published and ran every
# composition root as Native AOT on arm64 at the first attempt, with no tooling this file installs.
# win-arm64 followed, then both macOS RIDs, and every one of the six published and ran on the first
# attempt it was given a runner for. ADR 0012 carries every movement, the limit on the arm64 rows -
# an instruction set shared with android-arm64 and nothing else - and the rule the matrix follows.
#
# ONE FLAKE IS RECORDED HERE rather than left for whoever meets it. Of three win-arm64 attempts on
# 2026-09-01, one failed - in actions/setup-dotnet, installing the SDK, with an access violation
# and `Internal CLR error`, before a line of this component was built. It passed on either side of
# that. A green matrix is a statement about six publishes that happened, not a promise that the
# hosted images are reliable, and the arm64 Windows image is the one that has misbehaved so far.
#
# What has NOT changed is the sentence that matters: `docs/support.md` still claims no platform on
# the strength of this lane, and it should not. A workflow that has not run is a plan; a workflow
# that HAS run is still not a bundle. The block above says why - this lane collects no evidence,
# names no machine, and retains no configuration - so a RID moves from unclaimed to claimed on a
# deliberate collection into docs/evidence/ and on nothing else. ADR 0001's 2026-09-01 revision
# records both halves.

# HOW THIS FILE IS ENTERED, AND WHY IT IS NOT ENTERED DIRECTLY.
#
# This is one lane definition with two callers - broiler-vm.yml on every push and pull request,
# broiler-vm-full.yml on a release tag, a schedule and a button - because the alternative was two
# copies of six hundred lines of prose that would have drifted apart on the first edit. What a
# caller chooses is the RID matrix, the fuzz iteration count, the Octane benchmark selection and
# whether the emulator runs. It does not choose what any check MEANS, and it cannot skip one: a
# lane that could disable a check per caller would be two gates wearing one name. Each of those
# four is a DEPTH - the sessions run at whatever the count is, the workload runs on every cell
# whatever the selection is, and the false branch of the emulator switch still builds the head.
#
# WHY THERE ARE TWO CALLERS AT ALL, measured rather than assumed. On 2026-09-03 the whole matrix
# took 26m56s, and the breakdown says where it went: the six publish jobs spent 759, 882, 917,
# 1041, 1051 and 1405 seconds, of which the FUZZ AND MUTATE STEP was 88 to 91 per cent in every
# one of them. Everything else in a publish job - six Native AOT publishes of four composition
# roots, running each of them, and the package consumer - is 78 to 208 seconds. The comment on
# that step used to say the sessions "cost well under a second on the published image", which was
# never true and is why the cost was invisible; it is corrected in place below.
#
# A fuzz session is a total function of its seed and its seed corpus. Running the identical
# computation on six runtime identifiers is therefore six answers to one question, and what the
# extra five actually vary is the code generator underneath it. That is worth having - it is
# exactly how a JIT-versus-AOT or an arm64 code-generation defect would surface - and it is not
# worth twenty-five minutes on every push. So the quick lane runs the sessions short on two
# architectures and the full lane runs them long on all six.
#
# WHAT THE QUICK LANE THEREFORE DOES NOT PROVE, stated here rather than discovered later: it is
# blind to a Windows-only and a macOS-only regression until the full lane runs, and this component
# has already had one - the soak's heap plateau failed on macOS under Native AOT, on both
# architectures, byte-identically, while every other RID stayed flat. The quick lane is a fast
# signal and the full lane is the gate; a release goes through the full one.

name: broiler-vm lane

on:
  workflow_call:
    inputs:
      matrix:
        description: The publish matrix, as a JSON object with an `include` array of {os, rid}.
        required: true
        type: string
      fuzz-iterations:
        description: Iterations per fuzz session. Four sessions run, whatever this is.
        required: true
        type: number
      android:
        description: >
          Whether to boot the emulator. When false the mobile solution is still BUILT, so a head
          that stops compiling is a red job on every push rather than a discovery at release.
        required: true
        type: boolean
      octane-benchmarks:
        description: >
          The Octane benchmarks each publish cell runs, space-separated, or empty for all fifteen.
          A DEPTH and not a switch: the workload runs on every cell whatever this is, the same way
          the fuzz sessions run at whatever `fuzz-iterations` says. The names are checked against
          the pin, so a typo fails the step rather than shrinking the question it answers.
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Everything that is a property of the source rather than of the machine. It runs once, because
  # running it per platform would multiply the cost without multiplying the evidence: a rule about
  # the project graph has the same answer everywhere.
  checks:
    name: build, suites, graph and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # No global.json exists, so no SDK is pinned and the runner's own is used. That is
      # exclusion EX-03 and it is deliberate at preview: pinning an SDK the component has never
      # been recertified against would be a claim, and the evidence bundles record which SDK each
      # collection actually resolved.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with warnings as errors
        run: dotnet build Broiler.VM.slnx -c Release -warnaserror

      # One command, and it carries more than its name suggests. The architecture suite is where
      # the graph rules, the API baseline (M1), the catalog-drift baselines (K3), the composition
      # register (K1, K2), the Code Assurance generator (J1-J7), the review-record bindings (H1-H5)
      # and the baseline register (L1) all live, so "drift checks wired into CI" is this line.
      - name: Test
        run: dotnet test Broiler.VM.slnx -c Release --no-build

      # Asserted here as well as in the suite, because rule C1 reads a RETAINED pack log and this
      # reads the pack that just happened. The two can disagree, and the day they do is the day the
      # bundle went stale.
      - name: Pack, and check the package count
        run: |
          set -euo pipefail
          rm -rf artifacts/ci-pack && mkdir -p artifacts/ci-pack
          dotnet pack Broiler.VM.slnx -c Release -o artifacts/ci-pack
          nupkg=$(ls artifacts/ci-pack/*.nupkg | wc -l)
          snupkg=$(ls artifacts/ci-pack/*.snupkg | wc -l)
          echo "nupkg=$nupkg snupkg=$snupkg"
          test "$nupkg" -eq 3
          test "$snupkg" -eq 3

      # The one check that cannot be done from inside the solution: a consumer with no project
      # reference, restoring from a feed whose only source is the packages just built.
      - name: Restore and run the pristine feed consumer
        run: |
          set -euo pipefail
          rm -rf artifacts/feed && mkdir -p artifacts/feed
          dotnet pack Broiler.VM.slnx -c Release -o artifacts/feed -p:VersionSuffix=preview.1
          cd samples/Broiler.VM.Sample.FeedConsumer
          dotnet run -c Release -p:BroilerVmVersion=0.1.0-preview.1

      # Rollback, exercised. Two package sets on one feed; the consumer runs against the newer and
      # is then rolled back to the older, and prints which one it actually loaded.
      - name: Roll back and run again
        run: |
          set -euo pipefail
          dotnet pack Broiler.VM.slnx -c Release -o artifacts/feed -p:VersionSuffix=preview.2
          cd samples/Broiler.VM.Sample.FeedConsumer
          dotnet run -c Release -p:BroilerVmVersion=0.1.0-preview.2
          dotnet run -c Release -p:BroilerVmVersion=0.1.0-preview.1

      # THE THIRD-PARTY SUITE, SCORED AGAINST ITS FLOOR, AND THE ONLY LANE STEP HERE WHOSE INPUT
      # IS SOMEBODY ELSE'S MATERIAL. It became possible on 2026-09-03: the suite is archived in
      # this repository at a digest rule N15 checks, so a floor over it is a promise about bytes
      # this repository holds rather than about a directory a network hands back.
      #
      # WHY IT GUARDS SOMETHING NO EXIT CODE CAN. A case that stops being scorable is reported
      # SKIPPED and a run full of skips exits zero, so the adapter could start declining files, or
      # the language-class rule start calling earned refusals unearned, and this lane would stay
      # green over a shrinking number of passes. The floor names the figure.
      #
      # WHAT IT COSTS, MEASURED HERE RATHER THAN LOCALLY. About twelve seconds on this runner for
      # the whole step - extract, hash and score - which took the job from roughly a minute to
      # 1m12s. The same work is two minutes warm and over ten cold on win-x64, so the figure that
      # decided this step belonged here is the one this lane produced and not the one a workstation
      # did. It is dominated by hashing 56,560 files rather than by scoring 1,084 of them.
      #
      # ONCE, NOT PER CELL, AND THAT IS A NARROWING WORTH STATING. The two in-repository suites run
      # on every publish cell because a published image is what they are about; this one is about
      # the ENGINE's answers over a fixed corpus, which no runtime identifier changes, and 232 MB
      # of extraction on five cells would buy a repetition rather than a reading. So it runs here,
      # on one Linux runner, and the exclusion is that no other RID has scored this suite.
      - name: Score the archived third-party suite against its floor
        run: |
          set -euo pipefail
          pins="src/tests/conformance/pins"
          binary="src/compositions/Broiler.VM.Composition.JavaScript.Conformance/bin/Release/net10.0/Broiler.VM.Composition.JavaScript.Conformance"
          [ -f "$binary.exe" ] && binary="$binary.exe"

          # The archive is what is committed; the extraction is scratch and is never committed.
          # `--expect` is what makes the extraction answerable to the pin rather than to itself.
          rm -rf artifacts/t262 && mkdir -p artifacts/t262
          tar xzf "$pins"/test262-*.tar.gz -C artifacts/t262
          suite=$(find artifacts/t262 -maxdepth 1 -mindepth 1 -type d)

          "$binary" --suite "$suite" --expect "$pins/test262.pin" --dialect ingested --selfcheck src/tests/conformance/ingest-shape/selfcheck --run --include-negative --output artifacts/test262.report

          "$binary" --floor src/Broiler.VM.Profile.JavaScript/docs/conformance/floor-test262.txt --report artifacts/test262.report

  # Publish and run every advertised composition on every claimed RID, with trim and AOT warnings
  # as errors. Roadmap section 15 gate 5 asks for exactly this, and gate 2 asks that the closure
  # match its claim - which is why each composition is RUN and not merely published: a linker
  # annotation without execution is insufficient.
  publish:
    name: publish and run (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # THE MATRIX IS THE CALLER'S AND THE RULE FOR IT IS STILL THIS FILE'S. A caller may take a
      # SUBSET of the six cells below and may not invent a seventh: broiler-vm-full.yml names all
      # six and is the only lane a release passes through, so a RID that stopped being published
      # would fail there rather than quietly leaving the matrix. The comment that follows is the
      # rule the six were chosen by and it governs both callers.
      matrix: ${{ fromJSON(inputs.matrix) }}
    # THE SIX CELLS, AND THE RULE THAT PRODUCES THEM.
    #
    #   - { os: ubuntu-latest,   rid: linux-x64 }
    #   - { os: windows-latest,  rid: win-x64 }
    #   - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    #   - { os: windows-11-arm,  rid: win-arm64 }
    #   - { os: macos-latest,    rid: osx-arm64 }
    #   - { os: macos-15-intel,  rid: osx-x64 }
    #
    # EXACTLY ADR 0012's declared RID matrix, which is three since 2026-09-01. The first
    # two are the RIDs a head in the consuming repository publishes, so they are the ones
    # on which a claim could ever be collected; a lane entry for a RID the ADR marks
    # reserved is a publish nothing consumes and a row the support table may never carry,
    # which is why osx-arm64 was withdrawn the same day.
    #
    # linux-arm64 is declared for the ARCHITECTURE and not for a consumer, and the
    # distinction is the whole of what this entry proves. Nothing publishes it: the
    # consuming repository has no arm64 head, and the head that does ship arm64 ships it
    # as android-arm64 on Mono, which this component cannot target. So this job is the only
    # place arm64 code generation and arm64 Native AOT are compiled at all - and a green
    # result here is NOT Android coverage. It shares an instruction set with android-arm64
    # and nothing else: not the runtime, not the trimming configuration that head turns
    # off, not the packaging, not the head. ADR 0012's third 2026-09-01 revision carries
    # the same limit, because a reader meeting this matrix should not have to find it.
    #
    # It is also why linux-arm64 is the arm64 cell the QUICK lane takes. Measured on the
    # workload that lane runs - everything but the long fuzz sessions - it is the cheapest
    # arm64 cell at 78 seconds against osx-arm64's 108, and it varies from linux-x64 by the
    # architecture and by nothing else, so a red quick lane names the variable.
    #
    # The matrix is a GRID and every cell is filled: three Native AOT toolchains by two
    # architectures. MSVC into PE-COFF, clang into ELF, clang into Mach-O; x64 and arm64.
    # ADR 0012's fifth 2026-09-01 revision states the rule and this shape - a RID is
    # declared when its evidence is collectible on a lane AND it fills a cell no declared
    # RID fills. Six cells, six rows, nothing redundant and nothing left. A seventh RID
    # cannot come from this rule, because there is no seventh cell: it would have to come
    # from a CONSUMER, which is where android-* and ios-* sit and why they stay excluded -
    # not for want of a cell but for want of a harness that can run one.
    #
    # macos-13 is RETIRED and the difference matters to whoever edits this next: a label
    # that no longer resolves does not fail, it queues, so the job waits for a runner that
    # is never coming and the run never completes. That is how that entry was written -
    # macos-13 first, queued indefinitely, then the successor Intel image, which picked it
    # up in seconds and passed.
    steps:
      - uses: actions/checkout@v4

      # No global.json exists, so no SDK is pinned and the runner's own is used. That is
      # exclusion EX-03 and it is deliberate at preview: pinning an SDK the component has never
      # been recertified against would be a claim, and the evidence bundles record which SDK each
      # collection actually resolved.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish and run the core composition roots as Native AOT
        shell: bash
        run: |
          set -euo pipefail
          for composition in Calculator Workbench; do
            out="artifacts/ci-aot-$composition"
            dotnet publish "src/compositions/Broiler.VM.Composition.$composition" \
              -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o "$out"
            binary="$out/Broiler.VM.Composition.$composition"
            [ -f "$binary.exe" ] && binary="$binary.exe"
            "$binary"
          done

      # The JavaScript roots were absent from this lane until now, and their absence is how a
      # failing Native AOT run reached two retained evidence bundles without anything noticing:
      # they ran only under eng/collect-js-evidence.py, on one person's machine, when someone
      # chose to collect. A publish-and-run gate that covers two of the four composition roots
      # in the checkout is a gate over the half nobody was worried about.
      #
      # The soak's heap plateau runs here too, and it did not always. It was excluded on the
      # ground that a heap-plateau band on an ephemeral shared runner can be attributed to
      # nothing - which was correct about the check as it then stood, since that compared an
      # ABSOLUTE reading at cycle 99 against one at the end. The corrected check compares two
      # readings in one process on one machine, which is a ratio, and the objection does not
      # reach a ratio.
      #
      # That was not assumed. An experiment recorded 27 samples - three attempts, three runs,
      # three operating systems - and every one passed: 0.97 on linux-x64, 0.97 on win-x64, 0.90
      # on osx-arm64, with no variation at the hundredth. The third of those RIDs left the matrix
      # on 2026-09-01 and the reading is left here as it was taken, because an experiment is a
      # record of what ran. The absolute heaps differed hugely
      # across those platforms, about 153KB, 158KB and 388KB, and the ratio did not move. What a
      # shared runner makes unattributable is the byte count, and this check no longer reads one.
      #
      # Those runs retained nothing - this lane collects no bundle - so the numbers above are the
      # rationale for putting the step here and are evidence for nothing. No bundle cites them and
      # the profile's ledger states none of them, which is its own update rule 10 rather than
      # modesty: a figure with no retained record behind it is not a figure that document may carry.
      #
      # The band is 1.20 and a per-cycle leak of 8 bytes reads 1.57, so this lane fails on a leak
      # rather than merely hosting a check that cannot.
      - name: Publish and run the JavaScript composition roots as Native AOT
        shell: bash
        env:
          # The source sessions below take the same count the artifact sessions take, so the two
          # answer the same question about the same corpus at the same scale.
          ITERATIONS: ${{ inputs.fuzz-iterations }}
        run: |
          set -euo pipefail
          corpus="src/tests/corpus/js-1"

          suite="src/tests/conformance/js-3a"
          ingest="src/tests/conformance/ingest-shape"

          for composition in JavaScript.ExecutionOnly JavaScript.SliceCompiler JavaScript.Conformance JavaScript.Cli; do
            out="artifacts/ci-aot-$composition"
            dotnet publish "src/compositions/Broiler.VM.Composition.$composition" \
              -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
              -p:TreatWarningsAsErrors=true -o "$out"
            binary="$out/Broiler.VM.Composition.$composition"
            [ -f "$binary.exe" ] && binary="$binary.exe"

            # --closure first: a run that passes out of an image whose closure is wrong is a pass
            # nobody should accept, and the report is read off the published output.
            "$binary" --closure

            case "$composition" in
              *ExecutionOnly) "$binary" --corpus "$corpus" ;;
              *SliceCompiler)
                "$binary" --checks
                # THE SOURCE SURFACE'S SESSIONS, here rather than beside the artifact ones because
                # they need a lowering and the execution-only image carries none. Four seeds, the
                # same count the artifact sessions use, so the two answer the same question about
                # the same corpus. A session is a total function of its seed, so these decide the
                # same on a runner as on a workstation.
                for seed in 1 2 3 4; do
                  "$binary" --fuzz src/tests/corpus/js-1/source --seed "$seed" --iterations "$ITERATIONS"
                done
                ;;
              # Negatives included, because a lane that scored only the positive half would
              # publish totals nobody could compare with a release run's. The harness runs its
              # own regression suite and its self-check before it scores anything, so this one
              # command is three checks and reports which of them failed by its exit code.
              # BOTH SUITES, BECAUSE THEY EXERCISE DIFFERENT CODE. The first is written in this
              # component's own dialect and scores this front end against declarations naming its
              # diagnostic codes. The second is written in the dialect a third-party suite uses and
              # goes through the ingestion path - the metadata reader, the strictness readings, and
              # the rule that refuses to score a refusal this profile did not earn. A lane running
              # only the first would publish a green conformance step over an ingestion path no
              # published image had executed.
              *Conformance)
                "$binary" --suite "$suite" --run --include-negative
                "$binary" --suite "$ingest" --dialect ingested --run --include-negative
                ;;
              # THE END-USER HOST, RUN THE WAY A PERSON RUNS IT: a path on a command line, out of
              # the Native AOT image. Then the acceptance suite, which is the one check here whose
              # subject is a BINARY rather than a type - its argument parsing, its exit codes,
              # which of its two streams carries which message, and what it does with a file that
              # is not UTF-8. None of that is reachable from a test project, because rule A11
              # forbids a test project to reference a profile assembly.
              *Cli)
                "$binary" src/tests/cli/runs
                # The same probe the fuzz step below uses, and for the same reason it has
                # one: `python` is not on PATH on every runner image while `python3` is.
                # This was written from that step rather than from a failure here.
                py=python3
                command -v "$py" >/dev/null 2>&1 || py=python
                "$py" eng/run-cli-acceptance.py --binary-directory "$out"
                ;;
            esac
          done

      # THE TWO THIRD-PARTY WORKLOADS, OUT OF THE PUBLISHED IMAGE, ON EVERY CLAIMED RID.
      #
      # This step exists because of a specific failure and not for symmetry. A workload that has
      # only ever run on one machine under a JIT is what let a failing Native AOT run reach two
      # retained bundles before anything noticed, and the workload roadmap's last stage asks for
      # exactly this lane in those words. Both workloads run out of `artifacts/ci-aot-*`, which is
      # the image the step above published and ran the component's own suites through, so a
      # trimming or an AOT-shaped failure that the component's suites do not reach is caught by
      # the corpora that do.
      #
      # BOTH WORKLOADS RUN OVER A SELECTION THE CALLER SIZES, and for the same reason the fuzz
      # sessions run at an iteration count the caller sizes: the quick lane is on the push path and
      # the full lane is the gate. Neither caller may turn either workload OFF - the step below
      # runs on every cell of every caller - and what a caller chooses is how far it reaches.
      #
      # THE test262 SELECTION IS FIXED HERE AND THE OCTANE ONE IS AN INPUT, and the difference is
      # the extraction. The test262 archive is 232 MB extracted, so the step on the build job above
      # scores the whole suite once on one Linux runner and this step names four subtrees: the
      # ENGINE's answers over a fixed corpus are what a whole run measures, and no runtime
      # identifier changes them, while what DOES change with the identifier is whether the
      # published image can execute the corpus at all. The Octane pin is 37 files and extracting it
      # costs nothing - but RUNNING it is not free, which is the correction. Fifteen benchmarks out
      # of the published image took 23m28s on `ubuntu-latest`, on a job whose every other step
      # totals 78 to 208 seconds, and that is not a cost the push path can carry twice per push.
      #
      # THE WALL IS THE PROFILE'S OWN MAXIMUM, which is the second correction and the one that took
      # two attempts. The first bound was ten minutes, chosen from nothing, and `zlib` walked
      # through it on both Linux cells while reporting a score on a workstation - a red lane over a
      # number nobody had measured. The second was forty-five minutes, which was an estimate made
      # because the measurement kept refusing to arrive: `zlib` does not settle inside the hour
      # that `JavaScriptProfile.Maxima()` declares, on the JIT build or on the published AOT image,
      # so no completion exists on this machine to size a bound from. The hour IS the bound now,
      # because it is the most any composition of this profile may be granted - and the driver
      # prints each benchmark's duration beside its exit code, so the reading a runner gives is
      # there whether or not the benchmark scores.
      #
      # THE EXCLUSIONS, STATED HERE RATHER THAN DISCOVERED. No RID but the Linux one has scored the
      # whole conformance suite. No RID has scored the whole Octane set on the push path, and only
      # the full lane's cells score it at all. Both selections are readings about EXECUTION rather
      # than about conformance or about speed, and a figure from this step is retained by no bundle
      # and stated by no document.
      - name: Run the two third-party workloads out of the published image
        shell: bash
        # THE INPUT REACHES THE SCRIPT THROUGH THE ENVIRONMENT AND NOT THROUGH `${{ }}`. An
        # expression is expanded into the script's TEXT before bash sees it, so a caller's string
        # would be shell source rather than shell data. Both callers here pass literals and the
        # lane is not reusable outside this repository, so this is the habit rather than a hole -
        # and the habit is what stops the next input from being one.
        env:
          OCTANE_BENCHMARKS: ${{ inputs.octane-benchmarks }}
        run: |
          set -euo pipefail
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python

          # The selection the caller sized, one `--only` per name. An empty input is all fifteen,
          # and the driver refuses a name that is not a benchmark in the pin, so a typo here is a
          # red step rather than a smaller question answered green.
          #
          # POSITIONAL PARAMETERS RATHER THAN AN ARRAY, and the reason is a cell of this matrix.
          # `shell: bash` on the macOS images is bash 3.2, where `"${a[@]}"` on an EMPTY array is
          # an unbound-variable error under `set -u` - so the full lane, which passes no selection
          # at all, would fail on exactly the two cells the quick lane never runs. `"$@"` with no
          # parameters expands to nothing in every bash there is.
          set --
          for name in $OCTANE_BENCHMARKS; do
            set -- "$@" --only "$name"
          done

          # THE WALL IS THE PROFILE'S OWN HARD MAXIMUM, WHICH IS WHY IT IS NOT A NUMBER SOMEBODY
          # PICKED. `JavaScriptProfile.Maxima()` sets `WallClock` at 3,600,000 ms and calls it a
          # maximum "a host may tighten and may never loosen", so one hour is the most any
          # composition of this profile can be granted and a larger figure here would buy nothing -
          # a run asking for ninety minutes is bounded at sixty and reports the shorter one met.
          # The bound before this was ten minutes and then forty-five, and neither was a
          # measurement: the first went red on both Linux cells, and the second was an estimate
          # made because no completion could be obtained to size it from.
          #
          # WHY NO COMPLETION COULD BE OBTAINED. `zlib` does not settle within that hour on the
          # published Native AOT image on the machine this was measured on - it met the ceiling,
          # under both the JIT and the AOT image, at 3,600s each time. `richards` scores 32.0 on
          # that image on that machine and 46.3 on `ubuntu-latest`, so a runner is about 1.45 times
          # faster and needs somewhere above forty-one minutes for `zlib`. WHETHER THAT FITS INSIDE
          # THE HOUR IS NOT KNOWN, and the full lane is the first thing that will find out; the
          # quick lane's selection does not include `zlib`. A benchmark that meets THIS bound has
          # met the profile's own ceiling rather than a lane's preference, which is a finding worth
          # reporting rather than a bound worth moving.
          "$py" eng/run-octane.py --binary-directory artifacts/ci-aot-JavaScript.Cli \
            --wall 3600000 "$@"

          # The selection is four subtrees that between them reach the front end, the executor,
          # the realm's own objects and the suspension machinery, which is what makes a published
          # image's failure visible here rather than only in the whole run. `--expect` is what
          # makes the extraction answerable to the pin rather than to itself.
          pins="src/tests/conformance/pins"
          rm -rf artifacts/t262-rid && mkdir -p artifacts/t262-rid
          tar xzf "$pins"/test262-*.tar.gz -C artifacts/t262-rid
          suite=$(find artifacts/t262-rid -maxdepth 1 -mindepth 1 -type d)

          # THE EXIT CODE IS NOT THE ASSERTION HERE, and the driver's own header says why: 1 means
          # cases failed, which a whole run of this suite does today and which is a result rather
          # than a reason to stop. What this step asserts is that the run was MEASURED - the
          # driver stops before the merge when a shard reports the harness's own defect code, so a
          # merged report that exists and carries a total is the discriminator, and its absence
          # fails the lane.
          set +e
          "$py" eng/run-test262.py --suite "$suite" \
            --binary-directory artifacts/ci-aot-JavaScript.Conformance \
            --jobs 2 --out artifacts/test262-rid \
            --dir test/language/statements/class \
            --dir test/language/expressions/object \
            --dir test/built-ins/Array \
            --dir test/built-ins/Promise
          measured=$?
          set -e

          if [ ! -f artifacts/test262-rid/test262.report ]; then
            echo "the published image did not produce a merged report (driver exit $measured)" >&2
            exit 1
          fi

          grep -q '^total|' artifacts/test262-rid/test262.report || {
            echo "the merged report carries no total, so nothing was measured" >&2
            exit 1
          }

      # THE SHARDED RUN, WHICH IS A DIFFERENT QUESTION FROM THE STEP ABOVE.
      #
      # One unsharded run proves the totals. It cannot prove that the shards of a sharded run
      # cover the whole selection, and that is the property every published conformance figure
      # rests on: a run missing a shard adds to a smaller total that reads exactly like a smaller
      # suite. So the lane runs three shards and merges them, and the merge refuses unless the
      # cases it was handed account for the pre-sharding selected count that no shard can
      # influence.
      #
      # Three rather than one because a shard count of one makes the sharding function the
      # identity, and rather than many because the property is about coverage rather than about
      # scale. Sharding is a hash of the normalized path, so which tests land where is the same on
      # this runner as on a workstation - that is asserted by the harness's own regression suite
      # against stated values rather than against itself.
      - name: Score the conformance suite in shards and prove the shards covered it
        shell: bash
        run: |
          set -euo pipefail
          suite="src/tests/conformance/js-3a"
          ingest="src/tests/conformance/ingest-shape"
          binary="artifacts/ci-aot-JavaScript.Conformance/Broiler.VM.Composition.JavaScript.Conformance"
          [ -f "$binary.exe" ] && binary="$binary.exe"

          rm -rf artifacts/conformance && mkdir -p artifacts/conformance

          for shard in 0 1 2; do
            "$binary" --suite "$suite" --run --include-negative \
              --shard-index "$shard" --shard-count 3 \
              --output "artifacts/conformance/shard-$shard.report"
          done

          # The merged report is written OUTSIDE the directory being merged, and the harness
          # refuses the other arrangement: a merged report left among the shards is read as a
          # shard by the next merge.
          "$binary" --merge artifacts/conformance --output artifacts/conformance-merged.report

          # THE RATCHET. The floor is a reviewed record in the profile's own docs, it names the
          # suite revision it was set under, and it is never compared across revisions - a suite
          # that added tests would otherwise read as a regression. A run that falls below it fails
          # here; a run on a revision the floor was not set under says so and changes nothing,
          # because re-basing is a decision somebody makes rather than something a lane does.
          "$binary" --floor src/Broiler.VM.Profile.JavaScript/docs/conformance/floor.txt \
            --report artifacts/conformance-merged.report

          # And the control, run here rather than described: a merge missing one shard must report
          # incomplete coverage rather than a smaller total. This lane would otherwise be taking
          # the merge's own word for the one thing it exists to check.
          mv artifacts/conformance/shard-1.report artifacts/conformance/shard-1.held
          if "$binary" --merge artifacts/conformance; then
            echo "a merge missing shard 1 reported success; the coverage proof is not working" >&2
            exit 1
          fi
          mv artifacts/conformance/shard-1.held artifacts/conformance/shard-1.report

          # THE INGESTED SUITE GETS A FLOOR OF ITS OWN, AND IT GUARDS SOMETHING THE EXIT CODE
          # CANNOT. A case that stops being scorable is reported SKIPPED, and a skip is not a
          # failure - so the adapter could start declining files, or the rule could start
          # classifying earned refusals as unearned, and every run would still exit zero over a
          # shrinking number of passes. The floor is what notices, because it names the figure.
          "$binary" --suite "$ingest" --dialect ingested --run --include-negative \
            --output artifacts/ingest-shape.report
          "$binary" --floor src/Broiler.VM.Profile.JavaScript/docs/conformance/floor-ingest-shape.txt \
            --report artifacts/ingest-shape.report

          # AND THE FEATURE EXCLUSION IS ASSERTED HERE, BECAUSE THE FLOOR CANNOT SEE IT. A test
          # excluded for claiming a construct the suite itself calls a proposal never becomes a
          # case, so it is in no mode's executed or passed figure and an exclusion that silently
          # became a no-op would leave every floor row exactly where it is - while the run went
          # back to scoring tests about a language nothing here implements, and passing most of
          # them. The suite's `features.txt` declares three proposals and four cases claim one.
          #
          # The WHOLE selection line is pinned rather than the one column, and the brittleness is
          # deliberate: adding a fixture to this suite already re-bases its floor, which is a
          # decision somebody makes, and every stage of the pipeline is a figure that decision
          # should be made in front of. The line as read is printed when it does not match.
          grep -q '^selection|17|0|0|4|0|0|8|5|5$' artifacts/ingest-shape.report || {
            echo "the ingest-shape selection is not 4 cases excluded for claiming a proposal;" >&2
            grep '^selection|' artifacts/ingest-shape.report >&2
            exit 1
          }

      # The fuzz sessions and the corpus-integrity mutation were collection-only for the same
      # reason the roots were: nobody had put them here. A session is a total function of its seed
      # and its seed corpus - no wall clock, no thread count - so it decides the same on a runner
      # as on a workstation. A check that is deterministic and currently run by one person on one
      # machine is the definition of one that belongs in a lane.
      #
      # THIS COMMENT CARRIED A FALSE FIGURE UNTIL 2026-09-03, and the figure is why the cost of
      # this lane was invisible. It said four sessions of 25,000 iterations "cost well under a
      # second on the published image". They cost 759 seconds on linux-x64 and 1,405 on osx-x64,
      # which was 88 to 91 per cent of every publish job and therefore of the whole matrix. The
      # sentence was never measured; the numbers above are, from run 33738744632.
      #
      # THE ITERATION COUNT IS THE CALLER'S. Determinism is what makes that safe: a short session
      # is a prefix of a long one over the same seed, so the quick lane's 2,000 iterations find a
      # subset of what the full lane's 25,000 find and never something different. What a short
      # session cannot do is reach as far, so it is a fast signal and not the gate - and a session
      # still fails when it never reaches the executor, whatever its length, so a lane that had
      # shortened its way into exercising nothing would be red rather than quick.
      #
      # The seeds match eng/collect-js-evidence.py's FUZZ_SESSIONS deliberately. Determinism means
      # any seed would be a valid regression signal, but the SAME seeds mean this lane and a
      # retained bundle answer the same question, so a disagreement between them is a defect rather
      # than a different experiment.
      #
      # A session exits non-zero on a finding, and also when it answers identically every time or
      # never reaches the executor - so a session that stopped exercising anything fails here
      # rather than reporting clean iterations it did not earn. A finding turning this lane red is
      # the lane working: roadmap section 7 closes a counterexample with a named regression and
      # never with an allow-list entry.
      - name: Fuzz the JavaScript verifier and executor (${{ inputs.fuzz-iterations }} iterations), and mutate the retained corpus
        shell: bash
        env:
          ITERATIONS: ${{ inputs.fuzz-iterations }}
        run: |
          set -euo pipefail
          corpus="src/tests/corpus/js-1"
          binary="artifacts/ci-aot-JavaScript.ExecutionOnly/Broiler.VM.Composition.JavaScript.ExecutionOnly"
          [ -f "$binary.exe" ] && binary="$binary.exe"

          for seed in 1 2 3 4; do
            "$binary" --corpus "$corpus" --fuzz --seed "$seed" --iterations "$ITERATIONS"
          done

          # The mutation harness is shared with the evidence script rather than restated here:
          # it is one discipline with two callers, and the caller supplies the replay command.
          # This one replays through the PUBLISHED image, which the collection script cannot do.
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python
          "$py" eng/corpus-integrity.py --corpus "$corpus" -- "$binary" --corpus "$corpus"

          # The harness restores each entry and stops if a restore does not reproduce the original.
          # This asserts the same thing from outside it, because "the tool says it cleaned up" is
          # exactly the claim a reader should not have to take on trust - and a corpus left mutated
          # would make every later job in this run a test of the wrong bytes.
          git diff --exit-code -- "$corpus"

      - name: Publish and run the package consumer as Native AOT
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/feed && mkdir -p artifacts/feed
          dotnet pack Broiler.VM.slnx -c Release -o artifacts/feed -p:VersionSuffix=preview.1
          cd samples/Broiler.VM.Sample.FeedConsumer
          dotnet publish -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -p:BroilerVmVersion=0.1.0-preview.1 -o ../../artifacts/ci-sample-aot
          binary="../../artifacts/ci-sample-aot/Broiler.VM.Sample.FeedConsumer"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary"

  # THE ANDROID HEAD, ON AN EMULATOR.
  #
  # Split out for the reason the consuming repository splits its own: the workload costs several
  # minutes the other jobs should not pay for, and Broiler.VM.slnx deliberately does not carry the
  # head - a contributor must be able to build this component with the .NET SDK and nothing else.
  # Broiler.VM.Mobile.slnx carries it, ComponentGraph.SolutionFiles names both, and every group A
  # rule governs the head through that union.
  #
  # WHAT IT PROVES AND WHAT IT DOES NOT. The emulator is x86_64, so what runs is android-x64.
  # android-arm64 is published by this job and executed by nothing, which is why ADR 0012 declares
  # the first and not the second. A green result here is not evidence about Native AOT either:
  # Android runs Mono, and the head sets PublishTrimmed and RunAOTCompilation to false.
  # THE MOBILE BUILD, WHICH IS THE HALF EVERY LANE PAYS FOR.
  #
  # The emulator below is seven minutes and belongs to the full lane. Compiling the head is
  # ninety seconds and belongs to every lane, because a head that stops compiling is a defect a
  # pull request introduced and should not be a discovery made at release. This job is the
  # emulator job's own first two steps and nothing else, and it runs exactly when that job does
  # not, so no lane pays for both.
  mobile:
    name: android head (build only)
    if: ${{ !inputs.android }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build the mobile solution
        run: dotnet build Broiler.VM.Mobile.slnx -c Release

  android:
    name: android head (emulator)
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # net10.0-android needs the workload for the Mono runtime packs; without it the restore
      # fails outright rather than degrading, which is the behaviour to want.
      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build the mobile solution
        run: dotnet build Broiler.VM.Mobile.slnx -c Release

      # KVM is what makes an x86_64 emulator usable rather than glacial. The runner has the device
      # and not the permission, which is the one line of setup this job needs.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Hand-rolled rather than a third-party action, and deliberately: this repository pins two
      # actions, both first-party, and an emulator action would be a supply-chain dependency for
      # what is fifteen lines of sdkmanager and adb.
      - name: Boot an emulator and run the head
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_SDK_ROOT"
          image="system-images;android-36;google_apis;x86_64"

          # Licences are accepted from a FILE and not from `yes |`. Under `set -o pipefail` the
          # pipe form fails the step: sdkmanager stops reading, `yes` takes SIGPIPE, and the
          # pipeline's status becomes its failure - `yes: standard output: Broken pipe`, which
          # reads like a licence problem and is a shell one.
          seq 50 | sed 's/.*/y/' > /tmp/android-licences
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses < /tmp/android-licences > /dev/null

          # NOT redirected to /dev/null, and the first draft was. An sdkmanager that fails to
          # fetch an image says so on stdout and then `avdmanager` fails for a reason that reads
          # like an AVD problem; hiding the first message costs the next reader the whole trail.
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "$image" "platform-tools"
          # STDIN FROM /dev/null, not from `echo no`. avdmanager asks whether to build a custom
          # hardware profile; piping one line answers that question and leaves the tool reading a
          # closed pipe, and it then exits WITHOUT creating the AVD and without a non-zero status.
          # The failure surfaced four steps later as `Unknown AVD name [broiler]` from the
          # emulator, which is the last place a reader would look for it. An explicit device
          # profile means there is nothing to ask about in the first place.
          # WHERE the AVD lands is stated rather than left to the environment. avdmanager writes
          # to $ANDROID_AVD_HOME, then $ANDROID_SDK_HOME/avd, then $HOME/.android/avd, and the
          # emulator searches the same three in the same order - so a runner that sets one of them
          # differently from what the other assumes produces an AVD that exists and cannot be
          # found. Setting it once removes the question from both sides.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          "$sdk/cmdline-tools/latest/bin/avdmanager" create avd \
            -n broiler -k "$image" --device pixel_6 --force < /dev/null

          # And the AVD is CHECKED rather than assumed, for the reason above: the tool that
          # creates it can decline to and still exit 0.
          if ! "$sdk/emulator/emulator" -list-avds | grep -qx broiler; then
            echo "avdmanager exited cleanly and created no AVD named broiler"
            echo "--- emulator -list-avds"
            "$sdk/emulator/emulator" -list-avds || true
            echo "--- avdmanager list avd"
            "$sdk/cmdline-tools/latest/bin/avdmanager" list avd || true
            echo "--- $ANDROID_AVD_HOME"
            ls -la "$ANDROID_AVD_HOME" || true
            echo "--- environment"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset} HOME=$HOME"
            exit 1
          fi

          # The emulator's own output goes to a file rather than to the void, because when it
          # fails to start it explains itself there and nowhere else.
          "$sdk/emulator/emulator" -avd broiler -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &

          # BOUNDED, and the bound is the point. The first draft waited for sys.boot_completed in
          # an unbounded loop: when the emulator did not come up the step spun until the job's
          # own timeout and reported nothing, which is the least useful way for CI to fail. This
          # gives up after five minutes and prints what the emulator said.
          booted=no
          for _ in $(seq 1 60); do
            state="$("$sdk/platform-tools/adb" get-state 2>/dev/null || true)"
            if [ "$state" = "device" ]; then
              if [ "$("$sdk/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                booted=yes
                break
              fi
            fi
            sleep 5
          done

          if [ "$booted" != "yes" ]; then
            echo "the emulator did not report sys.boot_completed within five minutes"
            "$sdk/platform-tools/adb" devices || true
            tail -60 /tmp/emulator.log || true
            exit 1
          fi

          # The emulator is x86_64, so this is the RID that runs. The head reads its own RID off
          # the device and prints it into the closure report, so the log says which one it was
          # rather than which one the publish asked for.
          #
          # THIS STEP LOGS TWO WARNINGS ON EVERY RUN AND THEY ARE EXPECTED. `-t:Install` drives
          # adb, and against a freshly booted emulator the SDK's uninstall-before-install finds no
          # package to remove, so adb exits 1:
          #
          #   Xamarin.Android.Common.targets(3004,4): warning MSB6006: "adb" exited with code 1.
          #   Xamarin.Android.Common.targets(3004,4): warning XAAADB0000: Failure [DELETE_FAILED_INTERNAL_ERROR]
          #
          # The build then succeeds with zero errors, and the head installs, launches and reports.
          # They are recorded here because of how they SURFACE rather than because of what they
          # say: GitHub turns the second into an annotation whose whole message is the word
          # `Failure`, attributed to line 3004 of a file that is not in this repository - the
          # Android SDK's targets - which the annotation list renders as `.github#3004`. A reader
          # meeting `! Failure` on a green full lane has no route from there to any of this, and
          # both full-lane runs to date have carried the pair.
          #
          # NOT SUPPRESSED, deliberately. It is a true statement that adb failed, and the day it
          # means something else - an install that really did not happen - a silenced warning is
          # the one thing that would have said so.
          dotnet build src/compositions/Broiler.VM.Composition.JavaScript.Android \
            -c Release -f net10.0-android36.0 -p:RuntimeIdentifier=android-x64 -t:Install

          "$sdk/platform-tools/adb" logcat -c
          "$sdk/platform-tools/adb" shell monkey \
            -p com.broiler.vm.composition.javascript.android \
            -c android.intent.category.LAUNCHER 1
          sleep 40
          "$sdk/platform-tools/adb" logcat -d -s broiler-js-android:* | tee android.log

          # THE DIRECTION OF THIS CHECK IS THE POINT. It greps for the sentinel rather than for a
          # failure, so a crash, a failure to start and a failed check are all failures - an
          # application does not hand an exit code to a runner, and a job that looked for the word
          # FAILED would pass on a run that never happened.
          grep -q "broiler-js-android: 6 checks passed" android.log

      - name: Publish for android-arm64
        shell: bash
        run: |
          set -euo pipefail
          # Published and NOT run: no arm64 emulator boots on an x64 host at a usable speed, and
          # ADR 0012 does not declare a RID whose evidence stops at a build. This step exists so
          # that the arm64 build breaking is a red job rather than a discovery made later.
          dotnet publish src/compositions/Broiler.VM.Composition.JavaScript.Android \
            -c Release -f net10.0-android36.0 -p:RuntimeIdentifier=android-arm64
